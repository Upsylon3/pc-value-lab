name: PassMark score sync

on:
  schedule:
    # Mondays 05:17 UTC. Off the hour on purpose: GitHub queues :00 runs behind everyone else's.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the fixes (leave unticked for a report-only dry run)"
        type: boolean
        default: false

# The only permission needed: pushing the corrected builtin-parts.js back to the repo.
permissions:
  contents: write

# Two runs at once could push over each other; queue instead.
concurrency:
  group: passmark-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Compare with PassMark
        shell: bash
        env:
          # Scheduled runs always apply; manual runs apply only if the box was ticked.
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          # Optional. Without this secret, Supabase differences are reported but not fixed.
          PVL_ADMIN_PASSPHRASE: ${{ secrets.PVL_ADMIN_PASSPHRASE }}
        run: |
          flag=""
          if [ "$APPLY" = "true" ]; then flag="--apply"; fi
          # Keep going after a failure so the report still reaches the run summary.
          set +e
          python3 scripts/passmark_sync.py $flag > "$RUNNER_TEMP/report.md"
          code=$?
          cat "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Commit corrected scores
        shell: bash
        run: |
          # Only builtin-parts.js is ever committed, whatever else happens to be in the folder.
          git add builtin-parts.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync built-in scores with PassMark"
          git push
