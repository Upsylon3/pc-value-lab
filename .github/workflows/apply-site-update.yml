name: Apply site update (one time)

on:
  workflow_dispatch: # run it by hand from the Actions tab, once

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch index.html
        run: node scripts/patch-index.mjs

      - name: Save the result if anything changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "PassMark-only parts, remove user suggestions"
          git push
