# Pings the Supabase project once a day so the free tier never pauses it (it pauses after about a week without
# API calls). If the project is paused anyway and a SUPABASE_ACCESS_TOKEN secret exists, it restores it.
# If something cannot be fixed, the run fails on purpose: GitHub then emails you.
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 5 * * *"      # every day, 05:23 UTC. Daily (not weekly) so one skipped run cannot let it pause.
  workflow_dispatch:           # also lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/supabase-keepalive.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
